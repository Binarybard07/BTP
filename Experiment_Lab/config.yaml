# ==============================================================================
# Exhaustive Grid Search Configuration for Experiment Lab
# ==============================================================================
# Modular, Strategy-Agnostic architecture
# Every module (model, selector, portfolio, risk_manager) specifies:
#   pkg: <package_path>
#   cls: <class_name>
#   params: <kwargs_dict>
#
# Execution Modes:
#   - "grid": Full Cartesian product across all lists in `variations`.
#   - "ofat": One-factor-at-a-time comparisons around baseline.
#   - "explicit": Run only explicit combinations listed under 'explicit_combinations'.
# ==============================================================================

experiment_name: "grid_search_experiments"
engine: "nautilus"
mode: "grid"                 # Options: "grid", "ofat", "explicit"

execution:
  max_workers: 16           # Parallel backtest execution count (16 simultaneous workers)
  timeout_seconds: 3600     # 60-minute timeout per backtest

# ------------------------------------------------------------------------------
# 1. Baseline Configuration (Reference Model)
# ------------------------------------------------------------------------------
baseline:
  universe: "nifty500_ddq"
  start_date: "2019-01-01"  # Fixed 10-year research window start
  end_date: "2027-01-01"    # Fixed benchmark window end
  rebalance_frequency: "monthly"
  min_train_days: 1260      # Fixed 5 years warmup (5 x 252 trading sessions)
  target_horizon: 21
  drawdown_threshold: 0.0   # 0 = no dd exit

  # Model Component (Unified contract: pkg, cls, params)
  model:
    pkg: "equity_strategy.models.xgboost_regressor"
    cls: "XGBoostRegressor"
    params:
      n_estimators: 100
      max_depth: 3
      learning_rate: 0.05
      subsample: 0.80
      colsample_bytree: 0.80
      reg_alpha: 0.1
      reg_lambda: 1.0
      random_state: 42
      tree_method: "hist"
      n_jobs: 1

  # Selector Component
  selector:
    pkg: "equity_strategy.selection.percentile"
    cls: "PercentileSelector"
    params:
      percentile: 0.85
      min_return: 0.0

  # Portfolio Component
  portfolio:
    pkg: "equity_strategy.portfolio.equal_weight"
    cls: "EqualWeightPortfolio"
    params: {}

  # Risk Manager Component
  risk_manager:
    pkg: "equity_strategy.risk_management.fixed_percentage"
    cls: "FixedPercentageRiskManager"
    params:
      max_deployment_pct: 0.85

  # Comprehensive Multi-Factor Baseline Feature Set (16 logical features)
  features:
    # --- Multi-Horizon Momentum (Short to Long Lookbacks) ---
    return_5:
      indicator: "returns"
      params: {period: 5}
    return_10:
      indicator: "returns"
      params: {period: 10}
    return_21:
      indicator: "returns"
      params: {period: 21}
    return_63:
      indicator: "returns"
      params: {period: 63}
    return_126:
      indicator: "returns"
      params: {period: 126}
    return_252:
      indicator: "returns"
      params: {period: 252}

    # --- Trend / Mean Reversion (Normalized Distance: Close / MA) ---
    close_to_sma20:
      indicator: "close_to_sma"
      params: {period: 20}
    close_to_sma50:
      indicator: "close_to_sma"
      params: {period: 50}
    close_to_sma100:
      indicator: "close_to_sma"
      params: {period: 100}
    close_to_sma200:
      indicator: "close_to_sma"
      params: {period: 200}
    close_to_ema20:
      indicator: "close_to_ema"
      params: {period: 20}
    close_to_ema50:
      indicator: "close_to_ema"
      params: {period: 50}

    # --- Volatility & Risk Dynamics (Realized Volatility) ---
    volatility_10:
      indicator: "rolling_std"
      params: {period: 10}
    volatility_21:
      indicator: "rolling_std"
      params: {period: 21}
    volatility_63:
      indicator: "rolling_std"
      params: {period: 63}

    # --- Momentum Acceleration (Rate of Change) ---
    roc_21:
      indicator: "roc"
      params: {period: 21}

# ------------------------------------------------------------------------------
# 2. Grid Variations
# ------------------------------------------------------------------------------
variations:
  # A. Start Dates (Research Windows)
  start_date:
    - "2007-01-01"
    - "2019-01-01"

  # B. ALL 8 DDQ UNIVERSES
  universe:
    - "nifty50_ddq"
    - "nifty100_ddq"
    - "nifty200_ddq"
    - "nifty500_ddq"
    - "midcap50_ddq"
    - "midcap100_ddq"
    - "midcap150_ddq"
    - "smallcap250_ddq"

  # C. Rebalance Frequencies
  rebalance_frequency:
    - "monthly"
    - "quarterly"

  # D. Forward Target Horizons
  target_horizon:
    - 10
    - 21
    - 63

  # E. Stock Selection Strategy
  selector:
    # 1. Percentile Ranking (Top 25%, Top 20%, Top 10% quantiles) with Return Hurdle (0% and 5%)
    - pkg: "equity_strategy.selection.percentile"
      cls: "PercentileSelector"
      params:
        percentile: [0.75, 0.80, 0.90]
        min_return: [0.0, 0.05]

    # 2. Fixed Basket Selection
    - pkg: "equity_strategy.selection.top_n"
      cls: "TopNSelector"
      params:
        n: [10, 20]

  # F. Portfolio Allocation Strategy
  portfolio:
    # 1. Equal-Weighting Control (1/N)
    - pkg: "equity_strategy.portfolio.equal_weight"
      cls: "EqualWeightPortfolio"
      params: {}

    # 2. Alpha-Tilted Inverse Volatility (Sharpe Ratio Weighting)
    - pkg: "equity_strategy.portfolio.inverse_volatility"
      cls: "InverseVolatilityPortfolio"
      params:
        lookback: [63]
        min_obs: 40
        cap_mult: [2.5]
        use_alpha_tilt: [true]

  # G. Risk Management
  risk_manager:
    - pkg: "equity_strategy.risk_management.fixed_percentage"
      cls: "FixedPercentageRiskManager"
      params:
        max_deployment_pct: [0.70, 0.85, 0.95]

  # H. Drawdown Threshold: 0 (no dd exit), 15%, 20%, 25%
  drawdown_threshold:
    - 0.0   # no dd exit
    - 0.15  # 15% drawdown exit
    - 0.20  # 20% drawdown exit
    - 0.25  # 25% drawdown exit


# ------------------------------------------------------------------------------
# 3. Explicit Benchmark Combinations (Used when mode == "explicit")
# ------------------------------------------------------------------------------
explicit_combinations:
  # Combo 1: Conservative Large-Cap Monthly Momentum
  - universe: "nifty50_ddq"
    rebalance_frequency: "monthly"
    target_horizon: 21
    drawdown_threshold: 0.15
    min_train_days: 1260
    selector:
      pkg: "equity_strategy.selection.percentile"
      cls: "PercentileSelector"
      params: {percentile: 0.90, min_return: 0.0}
    risk_manager:
      pkg: "equity_strategy.risk_management.fixed_percentage"
      cls: "FixedPercentageRiskManager"
      params: {max_deployment_pct: 0.75}
    model:
      pkg: "equity_strategy.models.xgboost_regressor"
      cls: "XGBoostRegressor"
      params:
        n_estimators: 100
        max_depth: 3
        tree_method: "hist"
        learning_rate: 0.03
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 1.0

  # Combo 2: Broad Market Top-20 High Alpha
  - universe: "nifty500_ddq"
    rebalance_frequency: "monthly"
    target_horizon: 21
    drawdown_threshold: 0.20
    min_train_days: 1260
    selector:
      pkg: "equity_strategy.selection.top_n"
      cls: "TopNSelector"
      params: {n: 20}
    risk_manager:
      pkg: "equity_strategy.risk_management.fixed_percentage"
      cls: "FixedPercentageRiskManager"
      params: {max_deployment_pct: 0.90}
    model:
      pkg: "equity_strategy.models.xgboost_regressor"
      cls: "XGBoostRegressor"
      params:
        n_estimators: 200
        tree_method: "hist"
        max_depth: 4
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.7
        reg_alpha: 0.2
        reg_lambda: 2.0

  # Combo 3: Weekly Tactical Fast-Momentum Model
  - universe: "nifty100_ddq"
    rebalance_frequency: "weekly"
    target_horizon: 5
    drawdown_threshold: 0.25
    min_train_days: 504
    selector:
      pkg: "equity_strategy.selection.top_n"
      cls: "TopNSelector"
      params: {n: 10}
    risk_manager:
      pkg: "equity_strategy.risk_management.fixed_percentage"
      cls: "FixedPercentageRiskManager"
      params: {max_deployment_pct: 0.85}
    model:
      pkg: "equity_strategy.models.xgboost_regressor"
      cls: "XGBoostRegressor"
      params:
        n_estimators: 150
        tree_method: "hist"
        max_depth: 3
        learning_rate: 0.05
        subsample: 0.7
        colsample_bytree: 0.7
        reg_alpha: 0.1
        reg_lambda: 1.0

  # Combo 4: Positive Hurdle Threshold Strategy
  - universe: "nifty200_ddq"
    rebalance_frequency: "monthly"
    target_horizon: 21
    drawdown_threshold: 0.0
    min_train_days: 756
    selector:
      pkg: "equity_strategy.selection.threshold"
      cls: "ThresholdSelector"
      params: {threshold: 0.02, inclusive: false}
    risk_manager:
      pkg: "equity_strategy.risk_management.fixed_percentage"
      cls: "FixedPercentageRiskManager"
      params: {max_deployment_pct: 0.85}
    model:
      pkg: "equity_strategy.models.xgboost_regressor"
      cls: "XGBoostRegressor"
      params:
        n_estimators: 100
        max_depth: 3
        tree_method: "hist"
        learning_rate: 0.03
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 1.0

  # Combo 5: Alpha-Tilted Inverse Volatility Portfolio with Return Hurdle & DD Exit
  - universe: "nifty500_ddq"
    rebalance_frequency: "monthly"
    target_horizon: 21
    drawdown_threshold: 0.20
    min_train_days: 1260
    selector:
      pkg: "equity_strategy.selection.percentile"
      cls: "PercentileSelector"
      params: {percentile: 0.85, min_return: 0.0}
    portfolio:
      pkg: "equity_strategy.portfolio.inverse_volatility"
      cls: "InverseVolatilityPortfolio"
      params: {lookback: 63, min_obs: 40, cap_mult: 2.5, use_alpha_tilt: true}
    risk_manager:
      pkg: "equity_strategy.risk_management.fixed_percentage"
      cls: "FixedPercentageRiskManager"
      params: {max_deployment_pct: 0.85}
    model:
      pkg: "equity_strategy.models.xgboost_regressor"
      cls: "XGBoostRegressor"
      params:
        n_estimators: 100
        max_depth: 3
        tree_method: "hist"
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 1.0
