# ==============================================================================
# Exhaustive Grid Search Configuration for Experiment Lab
# ==============================================================================
# Modular, Strategy-Agnostic architecture mirroring RM_TM_TF_Combo:
# Every module (model, selector, portfolio, risk_manager) specifies:
#   pkg: <package_path>
#   cls: <class_name>
#   params: <kwargs_dict>
#
# Execution Modes:
#   - "grid": Full Cartesian product across all lists in `variations`.
#   - "ofat": One-factor-at-a-time comparisons around baseline.
#   - "explicit": Run only explicit combinations listed under 'explicit_combinations'.
# ==============================================================================

experiment_name: "exhaustive_ofat_experiments"
engine: "nautilus"
mode: "ofat"                 # Options: "grid", "ofat", "explicit"

execution:
  max_workers: 4            # Parallel backtest execution count
  timeout_seconds: 3600     # 60-minute timeout per backtest

# ------------------------------------------------------------------------------
# 1. Baseline Configuration (Sensible Reference Model)
# ------------------------------------------------------------------------------
baseline:
  universe: "nifty500_ddq"
  start_date: "2019-01-01"
  end_date: "2027-01-01"
  rebalance_frequency: "monthly"
  min_train_days: 1260
  target_horizon: 21

  # Model Component (Unified contract: pkg, cls, params)
  model:
    pkg: "equity_strategy.models.xgboost_regressor"
    cls: "XGBoostRegressor"
    params:
      n_estimators: 100
      max_depth: 3
      learning_rate: 0.05
      subsample: 0.80
      colsample_bytree: 0.80
      reg_alpha: 0.1
      reg_lambda: 1.0
      random_state: 42
      n_jobs: -1

  # Selector Component (PercentileSelector)
  selector:
    pkg: "equity_strategy.selection.percentile"
    cls: "PercentileSelector"
    params:
      percentile: 0.85

  # Portfolio Component (EqualWeightPortfolio)
  portfolio:
    pkg: "equity_strategy.portfolio.equal_weight"
    cls: "EqualWeightPortfolio"
    params: {}

  # Risk Manager Component (FixedPercentageRiskManager)
  risk_manager:
    pkg: "equity_strategy.risk_management.fixed_percentage"
    cls: "FixedPercentageRiskManager"
    params:
      max_deployment_pct: 0.90

  # Baseline Feature Set
  features:
    return_21:
      indicator: "returns"
      params: {period: 21}
    return_63:
      indicator: "returns"
      params: {period: 63}
    return_252:
      indicator: "returns"
      params: {period: 252}
    close_to_ma50:
      indicator: "close_to_sma"
      params: {period: 50}
    close_to_ma200:
      indicator: "close_to_sma"
      params: {period: 200}
    volatility_21:
      indicator: "rolling_std"
      params: {period: 21}

# ------------------------------------------------------------------------------
# 2. Exhaustive Variations Grid
# ------------------------------------------------------------------------------
variations:
  # ----------------------------------------------------------------------------
  # A. ALL 16 UNIVERSES (8 Standard + 8 DDQ Survivorship-Free)
  # ----------------------------------------------------------------------------
  universe:
    # Standard Presets
    - "nifty50"
    - "nifty100"
    - "nifty200"
    - "nifty500"
    - "midcap50"
    - "midcap100"
    - "midcap150"
    - "smallcap250"
    # DDQ Presets (Point-in-Time Membership)
    - "nifty50_ddq"
    - "nifty100_ddq"
    - "nifty200_ddq"
    - "nifty500_ddq"
    - "midcap50_ddq"
    - "midcap100_ddq"
    - "midcap150_ddq"
    - "smallcap250_ddq"

  # ----------------------------------------------------------------------------
  # B. MULTIPLE START & END DATES (Logical Market Regimes)
  # ----------------------------------------------------------------------------
  start_date:
    - "2016-01-01"          # Full Cycle (10 Years: Pre-COVID + COVId + Post-COVID -> Present)
    - "2019-01-01"          # COVID START + POST-COVID Bull & Rate-Hike Regime
    - "2022-01-01"          # Recent 4-Year Out-of-Sample Window

  end_date:
    - "2024-01-01"          # In-Sample Training Boundary
    - "2026-05-29"          # Official Research Benchmark Date
    - "2027-01-01"          # Extended Out-of-Sample Horizon

  # ----------------------------------------------------------------------------
  # C. SUPPORTED REBALANCE FREQUENCIES (Derived from loader.py)
  # ----------------------------------------------------------------------------
  rebalance_frequency:
    - "weekly"              # High-frequency tactical turnover
    - "monthly"             # Standard institutional rebalancing
    - "quarterly"           # Low-turnover, macro trend following

  # ----------------------------------------------------------------------------
  # D. MINIMUM TRAINING WARMUP DAYS (min_train_days)
  # ----------------------------------------------------------------------------
  min_train_days:
    - 252                   # 1 Trading Year
    - 756                   # 3 Trading Years
    - 1260                  # 5 Trading Years

  # ----------------------------------------------------------------------------
  # E. TARGET FORWARD HORIZONS (target_horizon in trading days)
  # ----------------------------------------------------------------------------
  target_horizon:
    - 5                     # 1-Week Forward Return
    - 10                    # 2-Week Forward Return
    - 21                    # 1-Month Forward Return (~21 trading days)
    - 30                    # 30-Day Forward Return
    - 63                    # 1-Quarter Forward Return (~63 trading days)

  # ----------------------------------------------------------------------------
  # F. MODEL METHODS (Plug-and-play with pkg, cls, params)
  # ----------------------------------------------------------------------------
  model:
    - pkg: "equity_strategy.models.xgboost_regressor"
      cls: "XGBoostRegressor"
      params:
        n_estimators: [50, 100, 200, 300]
        max_depth: [2, 3, 4, 6]
        learning_rate: [0.01, 0.03, 0.05, 0.10]
        subsample: [0.60, 0.80, 1.00]
        colsample_bytree: [0.60, 0.80, 1.00]
        reg_alpha: [0.0, 0.1, 1.0]          # L1 regularization (Lasso sparsity)
        reg_lambda: [0.5, 1.0, 5.0]         # L2 regularization (Ridge shrinkage)

  # ----------------------------------------------------------------------------
  # G. SELECTOR METHODS (Plug-and-play with pkg, cls, params)
  # ----------------------------------------------------------------------------
  selector:
    # 1. PercentileSelector (Cross-sectional percentile ranking)
    - pkg: "equity_strategy.selection.percentile"
      cls: "PercentileSelector"
      params:
        percentile: [0.75, 0.80, 0.85, 0.90, 0.95]

    # 2. TopNSelector (Fixed constituent count)
    - pkg: "equity_strategy.selection.top_n"
      cls: "TopNSelector"
      params:
        n: [5, 10, 15, 20, 30]

    # 3. ThresholdSelector (Absolute predicted return hurdle)
    - pkg: "equity_strategy.selection.threshold"
      cls: "ThresholdSelector"
      params:
        threshold: [0.00, 0.01, 0.02, 0.05]
        inclusive: false

  # ----------------------------------------------------------------------------
  # G. PORTFOLIO METHODS (Plug-and-play with pkg, cls, params)
  # ----------------------------------------------------------------------------
  portfolio:
    - pkg: "equity_strategy.portfolio.equal_weight"
      cls: "EqualWeightPortfolio"
      params: {}

  # ----------------------------------------------------------------------------
  # H. RISK MANAGEMENT (Capital Deployment Ceiling <= 0.97)
  # ----------------------------------------------------------------------------
  risk_manager:
    - pkg: "equity_strategy.risk_management.fixed_percentage"
      cls: "FixedPercentageRiskManager"
      params:
        max_deployment_pct: [0.60, 0.75, 0.85, 0.90, 0.97]

  # ----------------------------------------------------------------------------
  # I. FEATURE ENGINEERING VARIATIONS (Plug-and-play with indicator, params)
  # ----------------------------------------------------------------------------
  features:
    # 1. Multi-Horizon Pure Momentum (Short to Long Lookbacks)
    - return_5:
        indicator: "returns"
        params: {period: 5}
      return_10:
        indicator: "returns"
        params: {period: 10}
      return_21:
        indicator: "returns"
        params: {period: 21}
      return_63:
        indicator: "returns"
        params: {period: 63}
      return_126:
        indicator: "returns"
        params: {period: 126}
      return_252:
        indicator: "returns"
        params: {period: 252}

    # 2. Moving Average Extension & Distance-from-Trend (Mean Reversion)
    - close_to_sma20:
        indicator: "close_to_sma"
        params: {period: 20}
      close_to_sma50:
        indicator: "close_to_sma"
        params: {period: 50}
      close_to_sma100:
        indicator: "close_to_sma"
        params: {period: 100}
      close_to_sma200:
        indicator: "close_to_sma"
        params: {period: 200}
      close_to_ema20:
        indicator: "close_to_ema"
        params: {period: 20}
      close_to_ema50:
        indicator: "close_to_ema"
        params: {period: 50}

    # 3. Volatility-Normalized & Risk Dynamics (Risk-Adjusted Momentum)
    - return_10:
        indicator: "returns"
        params: {period: 10}
      return_21:
        indicator: "returns"
        params: {period: 21}
      return_63:
        indicator: "returns"
        params: {period: 63}
      volatility_10:
        indicator: "rolling_std"
        params: {period: 10}
      volatility_21:
        indicator: "rolling_std"
        params: {period: 21}
      volatility_63:
        indicator: "rolling_std"
        params: {period: 63}

    # 4. Comprehensive Multi-Factor Matrix (Momentum + ROC + Trend + Volatility)
    - return_21:
        indicator: "returns"
        params: {period: 21}
      return_63:
        indicator: "returns"
        params: {period: 63}
      return_252:
        indicator: "returns"
        params: {period: 252}
      roc_21:
        indicator: "roc"
        params: {period: 21}
      close_to_sma50:
        indicator: "close_to_sma"
        params: {period: 50}
      close_to_sma200:
        indicator: "close_to_sma"
        params: {period: 200}
      close_to_ema50:
        indicator: "close_to_ema"
        params: {period: 50}
      volatility_21:
        indicator: "rolling_std"
        params: {period: 21}
      volatility_63:
        indicator: "rolling_std"
        params: {period: 63}

    # 5. Short-Term Tactical / Swing Horizon (Weekly Rebalance & 5-10d Targets)
    - return_5:
        indicator: "returns"
        params: {period: 5}
      return_10:
        indicator: "returns"
        params: {period: 10}
      roc_10:
        indicator: "roc"
        params: {period: 10}
      close_to_ema10:
        indicator: "close_to_ema"
        params: {period: 10}
      close_to_sma20:
        indicator: "close_to_sma"
        params: {period: 20}
      volatility_10:
        indicator: "rolling_std"
        params: {period: 10}

    # 6. Long-Term Macro / Slow Trend Horizon (Quarterly Rebalance & 63d Targets)
    - return_63:
        indicator: "returns"
        params: {period: 63}
      return_126:
        indicator: "returns"
        params: {period: 126}
      return_252:
        indicator: "returns"
        params: {period: 252}
      close_to_sma100:
        indicator: "close_to_sma"
        params: {period: 100}
      close_to_sma200:
        indicator: "close_to_sma"
        params: {period: 200}
      volatility_63:
        indicator: "rolling_std"
        params: {period: 63}
  


# ------------------------------------------------------------------------------
# 3. Explicit Benchmark Combinations (Used when mode == "explicit")
# ------------------------------------------------------------------------------
explicit_combinations:
  # Combo 1: Conservative Large-Cap Monthly Momentum
  - universe: "nifty50_ddq"
    rebalance_frequency: "monthly"
    target_horizon: 21
    min_train_days: 1260
    selector:
      pkg: "equity_strategy.selection.percentile"
      cls: "PercentileSelector"
      params: {percentile: 0.90}
    risk_manager:
      pkg: "equity_strategy.risk_management.fixed_percentage"
      cls: "FixedPercentageRiskManager"
      params: {max_deployment_pct: 0.75}
    model:
      pkg: "equity_strategy.models.xgboost_regressor"
      cls: "XGBoostRegressor"
      params:
        n_estimators: 100
        max_depth: 3
        learning_rate: 0.03
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 1.0

  # Combo 2: Broad Market Top-20 High Alpha
  - universe: "nifty500_ddq"
    rebalance_frequency: "monthly"
    target_horizon: 21
    min_train_days: 1260
    selector:
      pkg: "equity_strategy.selection.top_n"
      cls: "TopNSelector"
      params: {n: 20}
    risk_manager:
      pkg: "equity_strategy.risk_management.fixed_percentage"
      cls: "FixedPercentageRiskManager"
      params: {max_deployment_pct: 0.90}
    model:
      pkg: "equity_strategy.models.xgboost_regressor"
      cls: "XGBoostRegressor"
      params:
        n_estimators: 200
        max_depth: 4
        learning_rate: 0.05
        subsample: 0.8
        colsample_bytree: 0.7
        reg_alpha: 0.2
        reg_lambda: 2.0

  # Combo 3: Weekly Tactical Fast-Momentum Model
  - universe: "nifty100_ddq"
    rebalance_frequency: "weekly"
    target_horizon: 5
    min_train_days: 504
    selector:
      pkg: "equity_strategy.selection.top_n"
      cls: "TopNSelector"
      params: {n: 10}
    risk_manager:
      pkg: "equity_strategy.risk_management.fixed_percentage"
      cls: "FixedPercentageRiskManager"
      params: {max_deployment_pct: 0.85}
    model:
      pkg: "equity_strategy.models.xgboost_regressor"
      cls: "XGBoostRegressor"
      params:
        n_estimators: 150
        max_depth: 3
        learning_rate: 0.05
        subsample: 0.7
        colsample_bytree: 0.7
        reg_alpha: 0.1
        reg_lambda: 1.0

  # Combo 4: Positive Hurdle Threshold Strategy
  - universe: "nifty200_ddq"
    rebalance_frequency: "monthly"
    target_horizon: 21
    min_train_days: 756
    selector:
      pkg: "equity_strategy.selection.threshold"
      cls: "ThresholdSelector"
      params: {threshold: 0.02, inclusive: false}
    risk_manager:
      pkg: "equity_strategy.risk_management.fixed_percentage"
      cls: "FixedPercentageRiskManager"
      params: {max_deployment_pct: 0.85}
    model:
      pkg: "equity_strategy.models.xgboost_regressor"
      cls: "XGBoostRegressor"
      params:
        n_estimators: 100
        max_depth: 3
        learning_rate: 0.03
        subsample: 0.8
        colsample_bytree: 0.8
        reg_alpha: 0.1
        reg_lambda: 1.0
