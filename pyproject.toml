[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equity-strategy"
version = "0.1.0"
description = "Equity Strategy and Backtest Framework"
authors = [
    { name = "Jenish", email = "jenishthakkar2004@gmail.com" }
]
requires-python = ">=3.11, <3.13"
dependencies = [
    "matplotlib>=3.8.0",
    "nautilus-trader>=1.190,<2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.2.3,<3.0.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
    "scipy>=1.10.0",
    "plotly>=5.0.0",
    "xgboost>=2.0.0",
    "jinja2>=3.1.5",
    "openpyxl>=3.1.5",
    "gspread>=6.1.4",
    "oauth2client>=4.1.3",
    "watchdog>=6.0.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
equity-strategy = "equity_strategy:main"

[tool.hatch.build.targets.wheel]
packages = ["src/equity_strategy"]

[tool.pytest.ini_options]
pythonpath = ["."]
